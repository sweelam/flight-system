name: "booking-service-test-runner"
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run tests
        run: |
          mvn clean test -f flight-auth-service/pom.xml
          mvn clean test -f flight-booking-service/pom.xml
          mvn clean test -f flight-gateway-service/pom.xml
          mvn clean test -f flight-notification-service/pom.xml
          mvn clean test -f flight-search-service/pom.xml
          mvn clean test -f flight-user-service/pom.xml